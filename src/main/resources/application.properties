server.port=8081
spring.application.name=root-and-rune

# Single-file embedded H2 database (data/conlangs.mv.db). Override with CONLANG_DB_URL.
spring.datasource.url=${CONLANG_DB_URL:jdbc:h2:file:./data/conlangs;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=YEAR}
spring.datasource.username=${CONLANG_DB_USER:sa}
spring.datasource.password=${CONLANG_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Sessions
server.servlet.session.timeout=14d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${CONLANG_SECURE_COOKIE:false}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.error.include-message=always

# Set CONLANG_REGISTRATION=false to close registration (admin can still create via first user)
conlang.registration=${CONLANG_REGISTRATION:true}

# Filled in by Maven resource filtering (see pom.xml version)
app.version=@project.version@
app.built=@maven.build.timestamp@

# always revalidate static files so a new app.js is picked up after an update
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
