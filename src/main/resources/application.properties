# ── Root and Rune + Weather generator ────────────────────────────────
# One app:  /  start page (log in)   /rune/  Root and Rune   /weather/  Weather generator
# Every value can be overridden with the environment variable shown.

server.port=${PORT:8080}
spring.application.name=root-and-rune

# ── Accounts (shared by both apps) ──
# false = only existing accounts can log in (the very first account can always be made, and becomes admin)
app.registration=${REGISTRATION:true}

# ── Database (shared by both apps) ──
# Default: one H2 file, data/hub.mv.db (no setup needed). Daily backups go to data/backups/.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/hub;MODE=PostgreSQL;NON_KEYWORDS=YEAR;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ── Weather generator ──
# Folder with regions/, additional-events.yaml, important_dates.yaml, influx.yaml, calendars.yaml
# (if it is missing, the copy packed in the jar is used)
eon.world-dir=${EON_WORLD_DIR:world}
# Extra weather admins (usernames, comma separated) are set with the EON_ADMINS environment variable.

# ── Login sessions ──
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true when the site is served over HTTPS
server.servlet.session.cookie.secure=${SECURE_COOKIE:false}
# Trust X-Forwarded-* headers when running behind a reverse proxy (nginx, Caddy…)
server.forward-headers-strategy=framework

# ── Uploads, errors, compression ──
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.error.include-message=always
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/javascript,image/svg+xml

# Filled in by Maven resource filtering (see pom.xml version)
app.version=@project.version@
app.built=@maven.build.timestamp@

# Browsers must re-check the page's files on every load, so updates show up immediately
# (unchanged files are answered with a quick "not modified").
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
