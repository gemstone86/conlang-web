      irrigation: 1
      harvest_festival: 1
      conscription: 2
      scribes: 1
      merchants: 2
      stone_quarry: 1
      census: 1
      festival: 1
      long_day: 1
      foraging: 1
      send_scouts: 1
      settle_land: 3
      core_territory: 2
      new_trading_route: 2
