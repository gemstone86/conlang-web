    type: event
    helper: true
    category: raid
    kind: raid
    strength: 8
    perShortfall: [{lose: {food: 1, production: 1}}]
    text: Raid, strength 8. Each point short costs 1 food and 1 production.
  sea_peoples_invasion:
    name: Sea Peoples' Landing
    type: event
    helper: true
    category: invasion
    kind: invasion
    strength: {perPlayerPerTerritory: 1}
    perShortfall: [{lose: {food: 1, production: 1}}]
    text: Invasion by the Sea Peoples, strength = players × territories + the massed enemies.
  climate_change:
