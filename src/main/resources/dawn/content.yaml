      city_walls: 2
      quarantine: 1
      priests: 1
      granary_reserve: 1
      # events
      barbarian_raid: 2
      gallic_warband: 2
      chariot_raiders: 1
      goths_invade: 1
      hill_tribes: 1
      nomad_empire: 1
      drought: 1
      earthquake: 1
      plague: 1
      revolt: 1
      civil_war: 1
      golden_age: 1
      great_scientist: 1
      refugees: 1
      comet_sighted: 1
      explorers: 1
      free_colony: 1
      great_expedition: 1
      rich_land_found: 1
      fortified_land_found: 1
      fertile_delta_found: 1
      wondrous_land_found: 1
