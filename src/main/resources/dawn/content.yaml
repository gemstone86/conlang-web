    strength: {perPlayerPerTerritory: 1}
    perShortfall: [{lose: {food: 1, production: 1}}]
    text: Invasion by the Sea Peoples, strength = players × territories + the massed enemies, drawn from the enemy deck.
  climate_change:
    name: Climate Change
    type: event
    crisis: true
    category: catastrophe
    target: each
    effects: [{stability: -1}]
    persistent:
      ongoing: [{income: {food: -2}}]
      cleanse: {culture: 6, research: 4}
    text: CRISIS. -1 Stability. Until lifted (6 culture + 4 research, 1 action), every player produces 2 less food per turn.
