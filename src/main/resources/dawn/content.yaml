# The starting event deck: 2 per player, drawn from these (number = copies in the pool).
startingEvents:
  wolf_pack: 2
  cold_night: 2
  fever: 1
  tribal_quarrel: 1
  good_hunt: 2
  strangers_at_the_fire: 1
  rival_tribe: 1
  small_fire: 1
  wandering_sage: 1
  scouts_return: 1

# Crisis cards: kept apart, added to the future deck only by other events or when a player's Population hits 0.
crisisCards: [black_plague, supervolcano, meteor_impact, climate_change]
# (Rise of a Nomad Empire and the Sea Peoples are crisis cards in the Ancient era deck.)

cards:
  # ---- city states: wait in the era decks; when picked they go among the lands to settle (3 influence per player)
  city_state:
    name: City State
    type: city_state
    land: city_state
    text: A city state goes among the lands to settle. Settling it costs 3 influence per player.
  # ---- leaders: drawn leaders play themselves at once, replace your current leader, and leave when the era ends
  # Prehistoric leaders
  first_shaman:
    name: The First Shaman
    type: leader
    effects: [{income: {culture: 1}}, {buildCost: {building: temple, production: 1}}]
    text: +1 culture per turn. Temples cost only 1 production to build.
  great_hunter:
    name: The Great Hunter
    type: leader
    effects: [{income: {food: 1}}, {maxSlots: {farm: 1}}]
    text: +1 food per turn and +1 max farm slot.
  storyteller:
    name: The Storyteller
    type: leader
    effects: [{eventUnder: 1}]
    text: When an event leaves the queue unpicked, you get the face-down card under it.
  great_mother:
    name: The Great Mother
    type: leader
    effects: [{handLimit: -2}, {actionsToHand: 1}]
    text: Hand size -2. Action cards that leave the queue go into your hand instead.
  first_ruler:
    name: The First Ruler
    type: leader
    effects: [{income: {culture: 1}}, {income: {production: 1}}]
    text: +1 culture and +1 production per turn.
  first_conqueror:
    name: The First Conqueror
    type: leader
    effects: [{halveEnemy: 1}]
    text: Enemy strength on lands to settle is halved (rounded up).
  first_architect:
    name: The First Architect
    type: leader
    effects: [{actionsPerTurn: 1}]
    text: +1 action per turn.
  # Ancient leaders
  tomyris:
    name: Tomyris
    type: leader
    effects: [{invasionDefense: 4}]
    text: +4 defense for the whole team against invasions.
  alexander_the_great:
    name: Alexander the Great
    type: leader
    effects: [{noEnemy: 1}]
    text: Enemy strength is always 0 on new lands and colonies.
  julius_caesar:
    name: Julius Caesar
    type: leader
    effects: [{ownStrengthPerTwoTroops: 1}]
    text: Your military strength is +1 for every 2 troops.
  gilgamesh:
    name: Gilgamesh
    type: leader
    effects: [{freeRecruit: 1}, {strengthBonus: 2}]
    text: The first troop you train each round takes no action (it still costs resources). +2 military strength.
  archimedes:
    name: Archimedes
    type: leader
    effects: [{income: {research: 1}}, {freeTech: 1}]
    text: +1 research per turn, and your next technology is played for free.
  hammurabi:
    name: Hammurabi
    type: leader
    effects: [{income: {research: 1}}, {handLimit: 1}]
    text: +1 research per turn and +1 hand size.
  ramses:
    name: Ramses
    type: leader
    effects: [{wonderGrowth: 1}]
    text: Every great wonder under construction gains 1 of each resource it needs, every round.
  # ------------------------------------------------------------------ technologies (cost research + resources)
  fire:
    name: Fire
    type: tech
    cost: {research: 2}
    effects: [{health: 1}, {raidDefense: 1}]
    text: +1 Health. Your camp is +1 defense against raids.
  stone_tools:
    name: Stone Tools
    type: tech
    cost: {research: 2, production: 1}
    effects: [{perWorker: {building: hunter, production: 1}}]
    text: Your hunters produce +1 production.
    required: true                       # always in the Prehistoric era deck
  lithic_art:
    name: Lithic Art
    type: tech
    cost: {research: 2, production: 1}
    effects: [{perWorker: {building: hunter, culture: 1}}]
    text: Your hunters produce +1 culture. Put it in a Hunters slot (competes with Stone Tools for the one slot).
  hunting:
    name: Hunting
    type: tech
    cost: {research: 2}
    effects: [{income: {food: 1}}, {army: 1}]
    text: +1 food per turn and 1 troop.
  animal_husbandry:
    name: Animal Husbandry
    type: tech
    cost: {research: 3, food: 2}
    effects: [{perWorker: {building: farm, food: 1}}]
    text: Your farmers produce +1 food.
  pottery:
    name: Pottery
    type: tech
    cost: {research: 3, production: 1}
    effects: [{handLimit: 1}, {income: {food: 1}}]
    text: +1 max hand size, +1 food per turn.
  mysticism:
    name: Mysticism
    type: tech
    cost: {research: 3, culture: 1}
    effects: [{perWorker: {building: temple, culture: 1}}]
    text: Your temple workers produce +1 culture.
  wanderlust:
    name: Wanderlust
    type: tech
    cost: {research: 2}
    effects: [{faceUpLands: 1}]
    text: One more land lies face up among the lands to settle.
  the_wheel:
    name: The Wheel
    type: tech
    cost: {research: 3, production: 1}
    effects: [{freeSettlers: 1}]
    text: Settling new territories costs 1 less population.
  spear_men:
    name: Spearmen
    type: tech
    cost: {research: 2, production: 2}
    effects: [{troopStrength: 1}, {recruitExtra: {production: 1}}, {troopUpkeep: 0.5}]
    text: Every troop counts for +1 more strength, but training one costs +1 production and each troop eats half a food per round. Put it in the Warriors bonus slot; take it out if your economy needs the relief.
  herbalism:
    name: Herbalism
    type: tech
    cost: {research: 3}
    effects: [{health: 2}, {income: {research: 1}}]
    text: +2 Health and +1 research per turn.
  agriculture:
    name: Agriculture
    type: tech
    required: true                       # always in the Prehistoric era deck
    cost: {research: 4, food: 2}
    effects: [{unlockBuilding: farm}, {retireBuilding: gatherer}, {growthDiscount: 3}]
    text: Unlocks the Farm for everyone and ends the building of more Gatherers (those you have stay). Growing costs 3 less food.
  metalworking:
    name: Metalworking
    type: tech
    required: true                       # always in the Ancient era deck
    cost: {research: 4, production: 3}
    effects: [{unlockBuilding: mine}, {retireBuilding: hunter}]
    text: Unlocks the Mine for everyone and ends the building of more Hunters (those you have stay).
  bronze_working:
    name: Bronze Working
    type: tech
    cost: {research: 4, production: 3}
    effects: [{strengthPerTwoTroops: 1}]
    text: Every player's military strength is +1 for every 2 troops (raids, invasions and enemy strength on lands).
  writing:
    name: Writing
    type: tech
    cost: {research: 4}
    effects: [{perWorker: {building: village, research: 1}}]
    text: Your village workers produce +1 research.
  masonry:
    name: Masonry
    type: tech
    cost: {research: 4, production: 2}
    effects: [{buildDiscount: {production: 1}}]
    text: Your buildings cost 1 production less.
  medicine:
    name: Medicine
    type: tech
    cost: {research: 5}
    effects: [{mitigate: plague}, {health: 1}]
    text: +1 Health. Plagues (including the Black Plague) do half the harm, for everyone.
  currency:
    name: Currency
    type: tech
    cost: {research: 5, influence: 1}
    effects: [{sharedPool: {income: {influence: 1}}}, {income: {influence: 1}}]
    text: Creates the shared pool (+1 influence per turn into it). +1 influence per turn for you.
  calendar:
    name: Calendar
    type: tech
    cost: {research: 4, culture: 1}
    effects: [{income: {food: 1, culture: 1}}]
    text: +1 food and +1 culture per turn.
  markets:
    name: Markets
    type: tech
    required: true                       # always in the Ancient era deck
    cost: {research: 4, culture: 1}
    effects: [{unlockBuilding: market}]
    text: Unlocks a new building for everyone, the Market (4 production and 2 culture; upkeep 1 food and 1 production per round). Each worker in it produces 1 influence and 1 culture.
  ancients_customs:
    name: Ancients Customs
    type: tech
    cost: {research: 4, culture: 2}
    effects: [{halveWonderUpkeep: true}]
    text: The upkeep of wonders from earlier eras is halved (rounded up).
  code_of_laws:
    name: Code of Laws
    type: tech
    cost: {research: 5, culture: 2}
    effects: [{stability: 2}]
    text: +2 Stability.
  horseback_riding:
    name: Horseback Riding
    type: tech
    cost: {research: 4, food: 2}
    effects: [{army: 2}, {raidDefense: 1}]
    text: 2 troops and +1 defense against raids.

  # ------------------------------------------------------------------ actions
  foraging:
    name: Foraging
    type: action
    effects: [{gain: {food: 3}}]
    text: +3 food.
  great_hunt:
    name: Great Hunt
    type: action
    effects: [{gain: {food: 2}}, {army: 1}]
    text: +2 food and 1 troop.
  flint_quarry:
    name: Flint Quarry
    type: action
    effects: [{gain: {production: 3}}]
    text: +3 production.
  cave_paintings:
    name: Cave Paintings
    type: action
    effects: [{gain: {culture: 2, research: 1}}]
    text: +2 culture, +1 research.
  arm_the_hunters:
    name: Arm the Hunters
    type: action
    cost: {production: 2}
    effects: [{army: 2}]
    text: Pay 2 production for 2 troops.
  storytelling:
    name: Storytelling
    type: action
    effects: [{draw: 2}, {gain: {culture: 1}}]
    text: Draw 2 cards, +1 culture.
  shamans_vision:
    name: Shaman's Vision
    type: action
    effects: [{gain: {research: 3}}]
    text: +3 research.
  shell_trading:
    name: Shell Trading
    type: action
    effects: [{gain: {influence: 2, food: 1}}]
    text: +2 influence, +1 food.
  gather_the_tribe:
    name: Gather the Tribe
    type: action
    cost: {food: 2}
    effects: [{population: 1}]
    text: Pay 2 food for +1 Population.
  long_day:
    name: A Long Day
    type: action
    effects: [{extraActions: 3}]
    text: +3 actions this turn (it costs 1 to play, so +2 in all).
  irrigation:
    name: Irrigation
    type: action
    effects: [{gain: {food: 4}}]
    text: +4 food.
  harvest_festival:
    name: Harvest Festival
    type: action
    effects: [{gain: {food: 2}}, {stability: 1}]
    text: +2 food, +1 Stability.
  conscription:
    name: Conscription
    type: action
    cost: {production: 2}
    effects: [{army: 3}]
    text: Pay 2 production for 3 troops.
  scribes:
    name: Scribes
    type: action
    effects: [{gain: {research: 4}}]
    text: +4 research.
  merchants:
    name: Merchants
    type: action
    effects: [{gain: {influence: 2, food: 2}}]
    text: +2 influence, +2 food.
  stone_quarry:
    name: Stone Quarry
    type: action
    effects: [{gain: {production: 4}}]
    text: +4 production.
  census:
    name: Census
    type: action
    cost: {food: 1}
    effects: [{population: 1}]
    text: Pay 1 food for +1 Population.
  festival:
    name: Festival
    type: action
    cost: {food: 2}
    effects: [{stability: 2}, {gain: {culture: 1}}]
    text: Pay 2 food for +2 Stability and +1 culture.

  send_scouts:
    name: Send Scouts
    type: action
    cost: {food: 1}
    effects: [{discover: 1}]
    text: Pay 1 food. Turn another land from the world deck face up; it stays until settled (with Settle cards).
  settle_land:
    name: Settle
    type: action
    effects: [{settle: true}]
    text: "Open a face-up land for settling (you may pay toward it at once). From then on anyone can send it resources, troops against its enemy strength (all of them are lost) and settlers, free on their turn, until its whole cost is paid."
  core_territory:
    name: Fortify the Heartland
    type: action
    cost: {production: 2, culture: 1}
    effects: [{core: true}]
    text: Make a territory of the realm a core territory. If an invasion would take it, it loses its core status instead.

  # ------------------------------------------------------------------ responses (played when an event resolves)
  rally_the_hunters:
    name: Rally the Hunters
    type: response
    respondsTo: [raid, invasion]
    effects: [{defense: 3}]
    text: +3 defense against this raid or invasion.
  hide_in_the_caves:
    name: Hide in the Caves
    type: response
    respondsTo: [raid, catastrophe]
    effects: [{halve: true}]
    text: Halve the losses from this raid or catastrophe.
  tribal_healer:
    name: Tribal Healer
    type: response
    respondsTo: [plague]
    effects: [{healthBonus: 3}]
    text: +3 Health against this plague.
  offering_to_the_spirits:
    name: Offering to the Spirits
    type: response
    respondsTo: [curse, unrest]
    effects: [{cancel: true}]
    text: Cancel this curse or unrest.
  city_walls:
    name: City Walls
    type: response
    cost: {production: 1}
    respondsTo: [raid, invasion]
    effects: [{defense: 5}]
    text: Pay 1 production for +5 defense against this raid or invasion.
  bronze_levy:
    name: Bronze Levy
    type: response
    cost: {food: 1}
    respondsTo: [raid, invasion]
    effects: [{defense: 4}]
    text: Pay 1 food for +4 defense against this raid or invasion.
  quarantine:
    name: Quarantine
    type: response
    respondsTo: [plague]
    effects: [{halve: true}]
    text: Halve the losses from this plague.
  priests:
    name: Priests
    type: response
    cost: {culture: 1}
    respondsTo: [curse, unrest]
    effects: [{cancel: true}]
    text: Pay 1 culture to cancel this curse or unrest.
  granary_reserve:
    name: Granary Reserve
    type: response
    respondsTo: [catastrophe]
    effects: [{halve: true}]
    text: Halve the losses from this catastrophe.

  # ------------------------------------------------------------------ minor wonders (built by one player)
  epic:
    name: Epic
    type: minor_wonder
    cost: {culture: 3, production: 2}
    effects: [{income: {culture: 1}}, {handLimit: 1}]
    text: +1 culture per turn, +1 max hand size.

  # ---- minor wonders (a card you play for its cost; the bonus is yours)
  first_farms:
    name: The First Farms
    type: minor_wonder
    cost: {production: 3, food: 2}
    obsoleteAfter: ancient
    effects: [{maxSlots: {farm: 2}}, {income: {food: 1}}]
    text: +2 farm slots and +1 food per turn. Fades after the Ancient era.
  first_mine:
    name: The First Mine
    type: minor_wonder
    cost: {production: 4}
    effects: [{maxSlots: {mine: 2}}, {income: {production: 1}}]
    text: +2 mine slots and +1 production per turn.
  oral_tradition:
    name: Oral Tradition
    type: minor_wonder
    cost: {culture: 2, production: 2}
    effects: [{income: {culture: 1}}, {income: {research: 1}}, {freeBuilding: village}]
    text: +1 culture and +1 research per turn, and a free village level (more village slots).
  first_religion:
    name: The First Religion
    type: minor_wonder
    cost: {culture: 2}
    obsoleteAfter: prehistoric
    effects: [{income: {culture: 2}}, {buildingDiscount: {building: temple, production: 1}}]
    text: +2 culture per turn, temples cost 1 less production. Fades after the Prehistoric era.
  great_tomb:
    name: The Great Tomb
    type: minor_wonder
    cost: {production: 5, culture: 3}
    effects: [{stability: 1}, {actionsPerTurn: 1}]
    text: +1 stability (happiness) and +1 action per turn.
  epic_wall:
    name: The Epic Wall
    type: minor_wonder
    cost: {production: 6, culture: 1}
    effects: [{raidDefense: 2}, {army: 3}]
    text: +2 defense against raids and 3 troops.
  great_trade_route:
    name: The Great Trade Route
    type: minor_wonder
    cost: {production: 5, food: 3, culture: 2}
    effects: [{income: {food: -2}}, {income: {production: 4}}, {maxSlots: {farm: 1}}, {maxSlots: {mine: 1}}]
    text: -2 food and +4 production per turn, +1 farm slot and +1 mine slot.

  new_trading_route:
    name: New Trading Route
    type: action
    minPlayers: 2                      # needs a teammate: not in the deck in solo games
    effects:
      - trade:
          - {give: {food: 1}, get: {production: 2}}
          - {give: {production: 1}, get: {food: 2}}
    text: Choose a teammate, then either pay 1 food so they get 2 production, or pay 1 production so they get 2 food.
  roman_roads:
    name: Roman Roads
    type: minor_wonder
    cost: {production: 4, culture: 2, influence: 1}
    effects: [{giveCards: 2}]
    text: You may give up to 2 cards to a teammate for 1 action. (Without roads, cards can't be given.)

  # ------------------------------------------------------------------ events
  # kind: raid (one player defends alone), invasion (everyone may send troops), test (a stat against a threshold),
  #       opportunity (the target may pay for a benefit), effects (just happens). target: one | each | civ.
  wolf_pack:
    name: Wolf Pack
    type: event
    category: raid
    kind: raid
    draws: {base: 0, perEra: 1}
    perShortfall: [{lose: {food: 1}}]
    text: "Raid: draw the Era number of enemy cards (Prehistoric 1, Ancient 2). Each point you fall short costs 1 food."
  legendary_predator:
    name: Legendary Predator
    type: event
    category: raid
    kind: raid
    strength: {base: 2, perPlayer: 1}
    perShortfall: [{lose: {food: 2}}]
    text: "Raid, strength = players + 2 (a fixed strength, no enemy cards are drawn). Each point you fall short costs 2 food."
  rival_tribe:
    name: Rival Tribe
    type: event
    category: raid
    kind: raid
    draws: {base: 1, perEra: 1}
    perShortfall: [{lose: {food: 1, production: 1}}]
    text: "Raid: draw the Era number + 1 enemy cards. Each point short costs 1 food and 1 production."
  wandering_horde:
    name: Wandering Horde
    type: event
    category: invasion
    kind: invasion
    strength: {perPlayerPerTerritory: 1}
    perShortfall: [{lose: {food: 1}}]
    text: Invasion, strength = players × territories + the massed enemies, drawn from the enemy deck. If it breaks through, a territory is lost and each point short costs every player 1 food.
  harsh_winter:
    name: Harsh Winter
    type: event
    category: catastrophe
    target: each
    effects: [{lose: {food: 2}}]
    text: Every player loses 2 food.
  cold_night:
    name: Cold Night
    type: event
    category: catastrophe
    target: each
    effects: [{lose: {food: 1}}]
    text: Every player loses 1 food.
  flash_flood:
    name: Flash Flood
    type: event
    category: catastrophe
    target: one
    effects: [{destroyBuilding: 1}, {lose: {food: 1}}]
    text: One player's building with the fewest workers loses a level (2 worker slots), and they lose 1 food.
  small_fire:
    name: Camp Fire Spreads
    type: event
    category: catastrophe
    target: one
    effects: [{lose: {production: 2}}]
    text: One player loses 2 production.
  fever:
    name: Fever
    type: event
    category: plague
    kind: test
    stat: health
    threshold: 2
    target: civ
    perShortfall: [{population: -1}]
    text: Health test 2. Each point short costs the civilization 1 Population.
  tribal_quarrel:
    name: Tribal Quarrel
    type: event
    category: unrest
    effects: [{stability: -1}]
    text: -1 Stability.
  bad_omen:
    name: Bad Omen
    type: event
    category: curse
    persistent:
      ongoing: [{income: {culture: -1}}, {stability: -1}]
      cleanse: {culture: 3}
    text: Until lifted (3 culture, 1 action), every player produces 1 less culture per turn and Stability drops by 1 each round.
  bountiful_season:
    name: Bountiful Season
    type: event
    category: boon
    target: each
    effects: [{gain: {food: 2}}]
    text: Every player gains 2 food.
  good_hunt:
    name: Good Hunt
    type: event
    category: boon
    target: each
    effects: [{gain: {food: 1}}]
    text: Every player gains 1 food.
  wandering_sage:
    name: Wandering Sage
    type: event
    category: boon
    target: one
    effects: [{gain: {research: 3}}]
    text: One player gains 3 research.
  strangers_at_the_fire:
    name: Strangers at the Fire
    type: event
    category: opportunity
    kind: opportunity
    offer:
      cost: {food: 2}
      effects: [{population: 1}]
    text: One player may pay 2 food to take them in (+1 Population).
  dawn_of_agriculture:
    name: Dawn of Agriculture
    type: event
    category: era
    effects: [{maxSlots: {farm: 1}}, {invasionStrength: 2}]
    text: "Era end. For the whole next era: +1 farm slot, but every invasion is 2 stronger."
  climate_crisis:
    name: Climate Crisis
    type: event
    category: era
    effects: [{maxSlots: {farm: 1}}, {settlerCost: 1}]
    text: "Era end. For the whole next era: +1 farm slot, but every colony costs 1 more settler."
  cult_of_ancestors:
    name: Cult of the Ancestors
    type: event
    category: era
    effects: [{income: {culture: 1}}, {handLimit: -1}]
    text: "Era end. For the whole next era: every player gets +1 culture per turn, but hand size is 1 smaller."
  end_of_prehistoric:
    name: End of an Era
    type: era_end
    text: "The Prehistoric era is coming to an end. This card can't be taken. When the third one is turned up, a special event ends the era, and its effects last through the next one."
  end_of_ancient:
    name: End of an Era
    type: era_end
    text: "The Ancient era is coming to an end. This card can't be taken. When the third one is turned up, a special event ends the era, and its effects last through the next one."
  iron_working:
    name: Iron Working
    type: tech
    cost: {research: 5, production: 3}
    effects: [{perWorker: {building: mine, production: 1}}]
    text: Your miners produce +1 production.
  philosophy:
    name: Philosophy
    type: tech
    cost: {research: 5, culture: 2}
    effects: [{income: {research: 1, culture: 1}}]
    text: +1 research and +1 culture per turn.
  mathematics:
    name: Mathematics
    type: tech
    cost: {research: 5}
    effects: [{perWorker: {building: village, research: 1}}]
    text: Your village workers produce +1 research.
  engineering:
    name: Engineering
    type: tech
    cost: {research: 5, production: 2}
    effects: [{buildDiscount: {production: 1}}]
    text: Buildings cost 1 less production.
  pericles:
    name: Pericles
    type: leader
    effects: [{income: {culture: 2}}]
    text: +2 culture per turn.
  hannibal:
    name: Hannibal
    type: leader
    effects: [{strengthBonus: 3}]
    text: +3 military strength.
  bronze_age_collapse:
    name: Bronze Age Collapse
    type: event
    category: era
    effects: [{maxSlots: {mine: 1}}, {settlerCost: 1}]
    text: "Era end. For the whole next era: +1 mine slot, but every colony costs 1 more settler."
  iron_age_dawns:
    name: The Iron Age Dawns
    type: event
    category: era
    effects: [{maxSlots: {mine: 1}}, {invasionStrength: 2}]
    text: "Era end. For the whole next era: +1 mine slot, but every invasion is 2 stronger."
  age_of_philosophers:
    name: Age of Philosophers
    type: event
    category: era
