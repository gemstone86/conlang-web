# Dawn of Mankind — game content and rule numbers.
#
# Technologies are global: once anyone researches one, its lasting effects help every player.
# Effects are one-key maps. See com.dawnofmankind.core.Effects for the full list:
#   immediate: gain, lose, population, army, stability, health, draw, extraActions, addCrisis, destroyBuilding, freeBuilding
#   lasting:   income, perWorker, handLimit, actionsPerTurn, raidDefense, mitigate, buildDiscount, sharedPool
#   response:  defense, halve, cancel, healthBonus
# Resources: food, production, culture, influence, research.

rules:
  actionsPerTurn: 4
  handLimit: 7
  startWorkers: {gatherer: 2, hunter: 1}  # start with Gatherers and Hunters; 3 Population: 2 gatherers, 1 hunter
  startResources: {food: 3, production: 2}
  growthCost: {food: 6}                   # action "grow": +1 Population (Agriculture takes 3 off) ...
  growthStep: 2                           # ... +1 food for every 2 people beyond the first
  buildingEscalation: 1                   # each level a building already has adds 1 production to the next
  unitSlots: {warriors: 1, population: 0}   # bonus slots of the army and of the idle people
  homeSlots: {farm: 2, mine: 2}           # farm and mine worker slots each player has before any territory
  startTerritories: 2                     # territories drawn from the world deck at the start
  faceUpLands: 2                          # face-up lands, paid off over time with Settle cards; replaced when settled
  # lands found by events must be settled at once, during the event (anyone, free), or they are discarded
  colonize:                               # the resource cost of an ordinary land
    costPerPlayer: {food: 2, production: 2}
    extraPerTerritoryPerPlayer: {production: 1}   # for each territory beyond the first 2
    territoriesBeforeExtra: 2
    settlersPerPlayer: 1                          # people who move to the new land (idle people first, then workers)
    # each point of colonization value (coasts, oceans) takes 1 per player off: production first, then food
  recruitCost: {production: 2}            # action "recruit": +1 troop
  foodUpkeepPerPop: 1
  startStability: 10
  startHealth: 2
  queueExtra: 4                           # queue size = players + 4
  removedPerRound: {1: 2, 2: 2, 3: 1, 4: 1, 5: 1, 6: 1}
  startingEventsPerPlayer: 2
  # what an era deck holds: base + perPlayer × players cards of each kind, drawn at random from that era's list below
  eraDeck:
    leader: {base: 1, perPlayer: 1}
    great_wonder: {base: 0, perPlayer: 1}
    minor_wonder: {base: 1, perPlayer: 1}
    hostility: {base: 0, perPlayer: 2}
    tech: {base: 6, perPlayer: 1}
    city_state: {base: 1, perPlayer: 0}
    action: {base: 24, perPlayer: 2}
    response: {base: 0, perPlayer: 1}
    event: {base: 12, perPlayer: 1}
    era_trigger: {base: 3, perPlayer: 0}       # the three end-of-era cards; when the third is turned up the era ends
  # the enemy deck at the start (strength: number of cards); raids and invasions draw from it, the cards go back after
  enemyDeck: {"1": 6, "2": 4}
  eraTriggerBottomPercent: 100            # the end-of-era cards are shuffled into the whole era deck (100%), not just the bottom part
  # fights: troops spent (up to the enemy's strength) must reach that strength (response cards add to it);
  # the troops spent settling a land are all lost; in invasions half of them, rounded up

# A player has one building of each type. Building it again adds a level: 2 more worker slots.
buildings:
  gatherer:
    upgradeSlots: 1
    name: Gatherers
    cost: {production: 2}
    slots: 2
    slotKey: farm                        # uses the same land slots as farms
    perWorker: {food: 2}
    text: Each gatherer produces 2 food. No more can be built once Agriculture is known.
  hunter:
    upgradeSlots: 1
    name: Hunters
    cost: {production: 2}
    slots: 2
    slotKey: mine                        # uses the same land slots as mines
    perWorker: {food: 1, production: 1}
    text: Each hunter produces 1 food and 1 production. No more can be built once Metalworking is known.
  farm:
    upgradeSlots: 2
    name: Farm
    locked: true                         # built only after the Agriculture tech
    cost: {production: 2}
    slots: 2
    perWorker: {food: 2}
    text: Each farmer produces 2 food.
  mine:
    upgradeSlots: 2
    name: Mine
    locked: true                         # built only after the Metalworking tech
    cost: {production: 2}
    slots: 2
    perWorker: {production: 2}
    text: Each miner produces 2 production.
  temple:
    upgradeSlots: 1
    name: Temple
    cost: {production: 3}
    slots: 2
    perWorker: {culture: 2}
    text: Each worker produces 2 culture (and 1 happiness, coming later).
  market:
    upgradeSlots: 1
    name: Market
    locked: true                         # built only after the Markets tech
    cost: {production: 4, culture: 2}
    slots: 2
    perWorker: {influence: 1, culture: 1}
    upkeep: {food: 1, production: 1}    # paid every round while you own one
    text: Each worker produces 1 influence and 1 culture. Upkeep 1 food and 1 production every round. Available once Markets has been researched.
  village:
    upgradeSlots: 1
    name: Village
    cost: {production: 3}
    slots: 2
    perWorker: {research: 1, culture: 1}
    text: Each worker produces 1 research and 1 culture.

# Great wonders are the measure of a game: the final score is the sum of their victory points, +1 per territory held.
# Each is also a card (same id) listed in an era below: when a player picks or draws it, it goes on the board.
# Bonuses and points are placeholders, to be reworked.
# Cost is per player, sized so a wonder takes the whole team 4-5 rounds of its output (a player makes roughly
# 3-4 production and some culture per round in the Prehistoric era, a little more in the Ancient era).
# The world deck: the shared realm's land. "slots" are extra worker slots for every player's buildings of that type;
# lose the territory and the slots (and any great wonder standing there) are lost. Effects apply to every player.
territories:
  plains:
    name: Plains
    copies: 3
    slots: {farm: 2}
    text: +2 max farm slots.
  mountains:
    name: Mountains
    copies: 3
    slots: {mine: 2}
    text: +2 mine worker slots.
  steppe:
    name: Steppe
    copies: 2
    slots: {farm: 1}
    effects: [{raidDefense: 2}, {invasionDefense: 2}]
    text: +1 farm worker slot. +2 military strength (against raids and invasions).
  jungle:
    name: Jungle
    copies: 2
    slots: {farm: 1}
    effects: [{income: {research: 1}}, {healthMod: -2}]
    text: "+1 farm worker slot. +1 research per turn. Unhealthy: -2 Health while you hold it."
  coast:
    name: Coast
    copies: 3
    slots: {farm: 1}
    colonization: 1
    text: +1 farm worker slot. +1 colonization value.
  forest:
    name: Forest
    copies: 3
    slots: {mine: 1}
    effects: [{income: {production: 1}}]
    text: +1 mine worker slot (lumber). +1 production per turn.
  ocean:
    name: Ocean
    copies: 2
    colonization: 1
    effects: [{income: {food: 1}}]
    text: +1 food per turn (fishing). +1 colonization value.
  # special lands: not in the world deck, found by events, with their own (higher) cost per player
  rich_land:
    name: Rich Land
    special: true
    slots: {farm: 2, mine: 2}
    effects: [{income: {culture: 1}}]
    costPerPlayer: {population: 2, army: 2}
    text: +2 farm and +2 mine worker slots, +1 culture per turn.
  fortified_land:
    name: Fortified Land
    special: true
    slots: {mine: 2}
    effects: [{raidDefense: 1}, {invasionDefense: 3}]
    costPerPlayer: {production: 3, army: 4}
    text: +2 mine worker slots. +1 raid defense for every player, +3 against invasions.
  city_state:
    name: City State
    special: true
    slots: {village: 2}
    effects: [{income: {culture: 1}}]
    costPerPlayer: {influence: 3}
    text: A city state joins your realm for influence alone (3 per player). +2 village slots and +1 culture per turn.
  wondrous_land:
    name: Wondrous Land
    special: true
    hasWonder: true                      # a great wonder of the era that is not in the game stands here; it is built when the land is settled
    enemy: 4
    costPerPlayer: {food: 6, production: 6, population: 1}
    text: "A land with a great wonder on it (one not yet in the game): the wonder is built the moment the land is settled. Costly: 4 extra food and production per player, and +4 enemy strength."
  fertile_delta:
    name: Fertile Delta
    special: true
    slots: {farm: 4}
    effects: [{income: {food: 1}}, {healthMod: -2}]
    costPerPlayer: {food: 4, production: 2, population: 1}
    text: "+4 farm worker slots, +1 food per turn. Unhealthy: -2 Health while you hold it."

greatWonders:
  stonehenge:
    name: Stonehenge
    era: prehistoric
    costPerPlayer: {production: 6, culture: 3}
    effects: [{actionsPerTurn: 1}]
    victoryPoints: 2
    text: Every player gets +1 action per turn.
  gobekli_tepe:
    name: Göbekli Tepe
    era: prehistoric
    costPerPlayer: {production: 6, culture: 3, research: 2}
    effects: [{income: {culture: 2}}, {growthDiscount: 1}, {maxSlots: {farm: 1}}]
    victoryPoints: 2
    text: Every player gets +2 culture per turn, growing costs 1 less food, and +1 farm slot.
  ggantija_temples:
    name: Ġgantija Temples
    era: prehistoric
    costPerPlayer: {production: 6, culture: 3}
    effects: [{wonderDouble: 1}, {maxSlots: {mine: 1}}]
    victoryPoints: 2
    text: Resources given to other great wonders count double. Every player gets +1 mine slot.
  skara_brae:
    name: Skara Brae
    era: prehistoric
    costPerPlayer: {production: 5, food: 6}
    effects: [{incomePerTerritory: {food: 1}}]
    victoryPoints: 2
    text: Every player gets +1 food per turn for each territory in the realm.
  pyramids:
    name: The Pyramids
    era: ancient
    costPerPlayer: {production: 13, culture: 4}
    effects: [{stability: 2}, {income: {culture: 2}}, {coreTerritory: 1}]
    victoryPoints: 2
    text: +2 Stability, every player +2 culture per turn, +2 victory points. Cores a territory (the one it stands in).
  hanging_gardens:
    name: The Hanging Gardens
    era: ancient
    costPerPlayer: {production: 9, food: 9}
    effects: [{perWorker: {building: farm, food: 1}}, {income: {culture: 1}}]
    victoryPoints: 2
    text: Every farmer +1 food, every player +1 culture per turn.
  great_library:
    name: The Great Library
    era: classical
    costPerPlayer: {production: 9, culture: 4, research: 3}
    effects: [{income: {research: 4}}, {handLimit: 1}]
    victoryPoints: 2
    text: Every player +4 research per turn and +1 max hand size.
  parthenon:
    name: The Parthenon
    era: classical
    costPerPlayer: {production: 11, culture: 5}
    effects: [{income: {culture: 2}}, {stability: 1}]
    victoryPoints: 2
    text: Every player gets +2 culture per turn and +1 Stability.
  colosseum:
    name: The Colosseum
    era: classical
    costPerPlayer: {production: 12, culture: 3}
    effects: [{stability: 2}, {raidDefense: 2}]
    victoryPoints: 2
    text: +2 Stability and +2 defense against raids for everyone.
  knossos:
    name: The Palace of Knossos
    era: ancient
    costPerPlayer: {production: 9, culture: 3, influence: 2}
    effects: [{income: {influence: 1}}, {settleDiscount: {production: 1}}]
    victoryPoints: 2
    text: Every player gets +1 influence per turn. Settling any land costs 1 production less.
  ziggurat_of_ur:
    name: The Ziggurat of Ur
    era: ancient
    costPerPlayer: {production: 9, culture: 3, research: 2}
    effects: [{income: {research: 1}}, {handLimit: 1}]
    victoryPoints: 2
    text: Every player gets +1 research per turn and +1 max hand size.
  karnak:
    name: The Temple of Karnak
    era: ancient
    costPerPlayer: {production: 11, culture: 4}
    effects: [{income: {culture: 2}}, {buildingDiscount: {building: temple, production: 1}}]
    victoryPoints: 2
    text: Every player gets +2 culture per turn, and temples cost 1 production less.
  pantheon:
    name: The Pantheon
    era: classical
    costPerPlayer: {production: 11, culture: 4}
    effects: [{income: {culture: 1}}, {perWorker: {building: temple, culture: 1}}]
    victoryPoints: 2
    text: Every player gets +1 culture per turn, and each temple worker produces +1 culture.
  great_wall:
    name: The Great Wall
    era: classical
    costPerPlayer: {production: 13, food: 2}
    effects: [{invasionDefense: 4}, {raidDefense: 1}]
    victoryPoints: 2
    text: +4 defense for the whole team against invasions and +1 against raids.
  nomadic_living:
    name: Nomadic Living
    era: prehistoric
    costPerPlayer: {production: 3, food: 3}       # cheap: about 2.5 rounds of the team's output
    effects: [{freeSettlers: 1}]
    victoryPoints: 1
    obsoleteAfter: prehistoric
    text: Settling any land takes 1 settler less. Obsolete once the Prehistoric era is over.
  great_lighthouse:
    name: The Great Lighthouse
    era: classical
    costPerPlayer: {production: 10, food: 3}
    effects: [{faceUpLands: 1}, {settleDiscount: {production: 2}}, {freeSettlers: 1}, {coreTerritory: 1}]
    victoryPoints: 2
    text: One more land lies face up. Settling any land costs 2 production and 1 settler less. Cores a territory (the one it stands in).
  colossus:
    name: The Colossus
    era: classical
    costPerPlayer: {production: 13, influence: 3}
    effects: [{perWorker: {building: mine, production: 1}}]
    victoryPoints: 2
    text: Every miner +1 production.

# Keywords: words in card texts and panels that show a rules box when hovered. "match" lists the spellings that count
# (whole words, any case; the longest match wins). Only the first appearance in a card or panel is marked.
keywords:
  stability:
    name: "Stability"
    match: [stability, happiness]
    text: "The tribe's shared mood. It starts at 10 and the game is lost if it reaches 0. Raids, invasions, revolts, crises and starvation lower it; techs, wonders and some events raise it."
  health_test:
    name: "Health test"
    match: [health test]
    text: "The tribe's Health is compared with the test's number. Every point short costs the tribe 1 Population (or what the card says)."
  health:
    name: "Health"
    match: [health]
    text: "How well the tribe resists sickness; it starts at 2. Health tests compare it with a number. Unhealthy lands (jungle, river delta) lower it while you hold them."
  population:
    name: "Population"
    match: [population]
    text: "Your people. Each eats 1 food every round. Workers fill building slots and produce; idle people produce nothing. Grow with the Grow action; if food runs short people starve (you choose who)."
  raid:
    name: "Raid"
    match: [raid, raids]
    text: "A strike on one player. Their defense (troops they have not committed elsewhere, plus raid defense and response cards) must reach the raid's strength. Each point short repeats the raid's losses and costs 1 Stability. Half the troops that fought (rounded up) are lost."
  invasion:
    name: "Invasion"
    match: [invasion, invasions]
    text: "A strike on the whole tribe. Players send troops; their combined military strength plus invasion defense must reach the invasion's strength. Half the troops sent (rounded up) are lost. If it breaks through, the losses repeat, a random territory is lost and Stability drops by 2. Massing enemies join it."
  defense:
    name: "Defense"
    match: [defense, raid defense, invasion defense]
    text: "Added to your military strength when you face a raid or an invasion. Raid defense helps against raids, invasion defense against invasions."
  strength:
    name: "Military strength"
    match: [military strength, strength]
    text: "What your troops are worth in a fight or when settling. Each troop counts for 1; techs and great people can add more, for example +1 for every 2 troops."
  troops:
    name: "Troops"
    match: [troop, troops, army]
    text: "Trained with the Recruit action (production). Troops sent against a raid, an invasion or an enemy on a land are spent; half the troops in a fight (rounded up) are lost, all troops sent to settle a land are lost."
  enemy:
    name: "Enemy strength"
    match: [enemy strength, enemies]
    text: "The military strength your troops must reach to settle a land. Events can raise it; some great people lower it. Massing enemies add to the next invasion."
  settle:
    name: "Settle"
    match: [settle, settling, settled]
    text: "To settle a land, pay its whole cost: resources, troops against its enemy strength and settlers (people). A Settle card opens a face-up land as a colony; a land found by an event must be paid for at once or it is lost."
  settlers:
    name: "Settlers"
    match: [settlers, settler]
    text: "People who move to a new land when it is settled. Idle people go first, then workers."
  colony:
    name: "Colony"
    match: [colony, colonies]
    text: "A land opened for settling. Anyone can send resources, troops and settlers to it (free, on their turn) until its whole cost is paid; then it joins the realm."
  core_territory:
    name: "Core territory"
    match: [core territory, core territories, core status]
    text: "A core territory survives an invasion or a civil war: it only loses its core status instead of being lost."
  territory:
    name: "Territory"
    match: [territory, territories]
    text: "A land of the shared realm. It gives every player worker slots and its bonus, and counts 1 point at the end. Lose a territory and its slots, bonus and any great wonder on it are lost; with none left the game is lost."
  great_wonder:
    name: "Great wonder"
    match: [great wonder, great wonders]
    text: "A wonder the whole tribe builds by giving resources (free, no action). Everyone gets its bonus and the tribe its victory points. An unfinished one is lost when the era ends (half of what was given comes back)."
  minor_wonder:
    name: "Minor wonder"
    match: [minor wonder, minor wonders]
    text: "A personal wonder one player builds; its bonus is theirs. Some fade after an era. You can drop one with Remove in the Bonuses panel."
  great_person:
    name: "Great person"
    match: [great person, great people]
    text: "Goes to your hand. Play it for 1 action and 4 resources of any kind per era (4 in the Prehistoric era, 8 in the Ancient); it replaces your current great person. A great person leaves when the era ends."
  upkeep:
    name: "Upkeep"
    match: [upkeep]
    text: "A cost paid every round. Wonders of earlier eras cost 1 production per era they are removed from (wonders of the current era are free). Some techs add food upkeep for troops."
  obsolete:
    name: "Fades"
    match: [fades, obsolete]
    text: "After the named era ends the bonus stops working (and costs no upkeep)."
  crisis:
    name: "Crisis"
    match: [crisis, crises]
    text: "A disaster that lasts for several rounds, striking again in every events phase until its time runs out or its end condition is met."
  response:
    name: "Response"
    match: [response, responses]
    text: "A card played during an event, before you press \"Done\". It helps against the event (more defense, less loss, cancelling a curse) and may cost resources."
  future_deck:
    name: "Future deck"
    match: [future deck]
    text: "Events that left the queue go face down here. After everyone's turn, as many events as it holds are drawn from the event deck and resolve."
  idle:
    name: "Idle"
    match: [idle]
    text: "People who have no building slot to work in. They eat but do not produce, and are the first to move away as settlers."
  slots:
    name: "Worker slots"
    match: [worker slots, slots, slot]
    text: "Room for workers in a building. Farms and mines have 2 slots per level; land and territories raise how many levels may work. A building above what your land allows is inactive until there is room."
  hand_limit:
    name: "Hand size"
    match: [max hand size, hand size, hand limit]
    text: "The most cards you may keep in your hand at the end of your turn."
  lasting:
    name: "Lasting event"
    match: [lasting event, lasting events, lifted, lift]
    text: "An event that stays in play with an ongoing effect until someone pays the cost to lift it (and 1 action)."

