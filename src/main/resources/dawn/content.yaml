    helper: true
    category: raid
    kind: raid
    draws: {base: 0, perEra: 4}
    perShortfall: [{lose: {food: 1, production: 1}}]
    text: "Raid: draw 4 enemy cards for every Era number (8 in the Ancient era). Each point short costs 1 food and 1 production."
  sea_peoples_invasion:
