  # ------------------------------------------------------------------ crisis cards
  # Crises last: they act when they resolve and again in each following events phase ("lasts"), until their rounds
  # run out or their end condition is met.
  black_plague:
    name: Black Plague
    type: event
    crisis: true
    category: plague
    target: civ
    lasts:
      rounds: 3
      endWhen: {health: 8}
      everyRound: [{healthTest: {threshold: 8, populationLoss: 1}}]
    text: "CRISIS, up to 3 rounds. Each round: health test 8, each point short costs the civilization 1 Population. Ends early once Health reaches 8. Medicine halves it."
  supervolcano:
    name: Supervolcano Eruption
    type: event
    crisis: true
    category: catastrophe
    target: each
    lasts:
      rounds: 3
      stages:
        - [{lose: {food: 4, production: 4}}, {destroyBuilding: 1}, {stability: -2}]
        - [{lose: {food: 2}}]
        - [{lose: {food: 2}}]
    text: "CRISIS, 3 rounds. First: every player loses 4 food, 4 production and a building level, -2 Stability. Then two rounds of ash winter: every player loses 2 food."
  meteor_impact:
    name: Meteor Impact
    type: event
    crisis: true
    category: catastrophe
    target: civ
    lasts:
      rounds: 2
      stages:
        - [{population: -4}, {lose: {production: 3}}, {stability: -2}]
        - [{stability: -1}, {lose: {food: 1}}]
    text: "CRISIS, 2 rounds. First: the civilization loses 4 Population, every player 3 production, -2 Stability. Then: -1 Stability, every player loses 1 food."
  nomad_empire:
    name: Rise of a Nomad Empire
    type: event
    crisis: true
    category: invasion
    lasts:
      rounds: 10
      everyRound: [{threat: 2}, {invadeIfStronger: nomad_invasion}]
    text: "CRISIS, 10 rounds. Each round +2 enemies mass. Whenever they outnumber the tribe's military strength, they invade at once."
  sea_peoples:
    name: The Sea Peoples
    type: event
    crisis: true
    category: invasion
    lasts:
      rounds: 2
      stages:
        - [{raidAll: {card: sea_peoples_raid, strength: 8}}]
        - [{invasion: sea_peoples_invasion}]
    text: "CRISIS, 2 rounds. First a double-strength raid (8) on every player, then an invasion."
  # the raids and invasions crises send (not in any deck)
  nomad_invasion:
    name: Nomad Horde
    type: event
    helper: true
    category: invasion
    kind: invasion
    strength: {perPlayerPerTerritory: 1}
    perShortfall: [{lose: {food: 1, production: 1}}]
    text: Invasion by the nomad empire, strength = players × territories + the massed enemies.
  sea_peoples_raid:
