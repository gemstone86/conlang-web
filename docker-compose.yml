# Root and Rune + Weather generator. Start with: docker compose up -d --build  →  http://localhost:8080
services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data            # the H2 database file and its daily backups
    environment:
      REGISTRATION: "true"          # "false" once everyone has an account
      SECURE_COOKIE: "false"        # "true" when served over HTTPS
      # EON_ADMINS: "Gemstone"      # extra weather admins (site admins always are)
    restart: unless-stopped
