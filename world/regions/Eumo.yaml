# Öken, mildare än Tarkas.
name: "Eumo"

temperature:
  jan: 12
  feb: 15
  mar: 19
  apr: 24
  may: 29
  jun: 32
  jul: 33
  aug: 32
  sep: 29
  oct: 24
  nov: 18
  dec: 14

temperature_drop: 12
drop_speed: 5

# Höjden (m ö.h.) som temperaturerna ovan gäller för. I 3D blir det 6,5° kallare per km över den.
base_heat_height: 300

precipitation:
  jan: -1
  feb: -2
  mar: -2
  apr: -3
  may: -4
  jun: -4
  jul: -4
  aug: -4
  sep: -3
  oct: -2
  nov: -2
  dec: -1

shift: 0

# Molntäcke: -1 ger något klarare himmel (bara kartan, inte vädret).
cloud_cover: -1

wind:
  jan: 1
  feb: 1
  mar: 1
  apr: 0
  may: 0
  jun: 0
  jul: 0
  aug: 0
  sep: 0
  oct: 1
  nov: 1
  dec: 1

# Förhärskande vind (västanvind, ca 30° N): varifrån vinden oftast blåser
# och hur stor del av dagarna (%). Övriga dagar: oftast en grannriktning, ibland vilken som helst.
prevailing_wind: SW
prevailing_chance: 45

events:
  - name: "Drake"
    occurs: 1
    days: 1000
  - name: "Sandstorm"
    occurs: 1
    days: 50
  - name: "Värmebölja (+10C)"
    occurs: 1
    days: 200
