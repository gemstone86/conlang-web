# Guldhavet: ungefär som Nordsjön. En magisk ström för varje aspekt (+3), ungefär en i veckan totalt. De är vanliga händelser, inte magiska stormar.
name: "Guldhavet"

temperature:
  jan: 5
  feb: 4
  mar: 5
  apr: 7
  may: 10
  jun: 13
  jul: 16
  aug: 17
  sep: 15
  oct: 12
  nov: 9
  dec: 6

temperature_drop: 3
drop_speed: 1

# Höjden (m ö.h.) som temperaturerna ovan gäller för. I 3D blir det 6,5° kallare per km över den.
base_heat_height: 0

precipitation:
  jan: 1
  feb: 1
  mar: 1
  apr: 1
  may: 0
  jun: 0
  jul: 1
  aug: 1
  sep: 1
  oct: 2
  nov: 2
  dec: 2

