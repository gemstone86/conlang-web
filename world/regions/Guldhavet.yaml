  mar: 2
  apr: 1
  may: 1
  jun: 1
  jul: 1
  aug: 1
  sep: 2
  oct: 2
  nov: 3
  dec: 3

# Förhärskande vind (västanvind, ca 53° N): varifrån vinden oftast blåser
# och hur stor del av dagarna (%). Övriga dagar: oftast en grannriktning, ibland vilken som helst.
prevailing_wind: SW
prevailing_chance: 45

