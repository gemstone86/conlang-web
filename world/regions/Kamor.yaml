# Kamor: samma temperaturer som norra Frankrike (Paris/Lille). Milt, fuktigt kustklimat med regn året runt.
name: "Kamor"

temperature:
  jan: 4
  feb: 5
  mar: 8
  apr: 10
  may: 14
  jun: 17
  jul: 19
  aug: 19
  sep: 16
  oct: 12
  nov: 7
  dec: 5

temperature_drop: 2
drop_speed: 1

# Höjden (m ö.h.) som temperaturerna ovan gäller för. I 3D blir det 6,5° kallare per km över den.
base_heat_height: 200

precipitation:
  jan: 1
  feb: 1
  mar: 1
  apr: 1
  may: 1
  jun: 1
  jul: 1
  aug: 1
  sep: 1
  oct: 2
  nov: 2
  dec: 1

shift: 0

wind:
  jan: 1
  feb: 1
  mar: 1
  apr: 1
  may: 0
  jun: 0
  jul: 0
  aug: 0
  sep: 1
  oct: 1
  nov: 1
  dec: 1

# Förhärskande vind (västanvind, ca 47° N): varifrån vinden oftast blåser
# och hur stor del av dagarna (%). Övriga dagar: oftast en grannriktning, ibland vilken som helst.
prevailing_wind: SW
prevailing_chance: 45

events:
  - name: "Drake"
    occurs: 1
    days: 1000
