# Koyn-Doloz: som Blå havet men 8 grader varmare. Värmen sprids inte till grannområdena på kartan.
name: "Koyn-Doloz"

temperature:
  jan: 6
  feb: 10
  mar: 15
  apr: 19
  may: 24
  jun: 27
  jul: 31
  aug: 31
  sep: 26
  oct: 20
  nov: 13
  dec: 9

temperature_drop: 5
drop_speed: 5

# Höjden (m ö.h.) som temperaturerna ovan gäller för. I 3D blir det 6,5° kallare per km över den.
base_heat_height: 200

precipitation:
  jan: 1
  feb: 1
  mar: 1
  apr: 1
  may: 3
  jun: 3
  jul: 3
  aug: 3
  sep: 3
  oct: 2
  nov: 2
  dec: 2

shift: 0

# Värmen stannar i Koyn-Doloz: på kartan styr området helt inom detta avstånd från sina
# punkter (andel av kartans bredd, 0.015 ≈ 48 px på Mundana) och sprider sig inte utanför.
contained_radius: 0.015

wind:
  jan: 1
  feb: 1
  mar: 1
  apr: 1
  may: 1
  jun: 1
  jul: 2
  aug: 2
  sep: 1
  oct: 1
  nov: 1
  dec: 1

# Förhärskande vind (västanvind, ca 48° N): varifrån vinden oftast blåser
# och hur stor del av dagarna (%). Övriga dagar: oftast en grannriktning, ibland vilken som helst.
prevailing_wind: SW
prevailing_chance: 45

events:
  - name: "Svår åska"
    occurs: 1
    days: 250
  - name: "Lindormsanfall"
    occurs: 1
    days: 500
