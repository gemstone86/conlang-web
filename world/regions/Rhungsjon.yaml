# Rhungsjön: ungefär som Igonhavet, men 2 grader kallare.
# Havet ligger efter land: varmast runt augusti, kallast runt mars.
name: "Rhungsjön"

temperature:
  jan: 10
  feb: 8
  mar: 7
  apr: 10
  may: 12
  jun: 14
  jul: 18
  aug: 22
  sep: 20
  oct: 16
  nov: 14
  dec: 13

temperature_drop: 1
drop_speed: 0

# Höjden (m ö.h.) som temperaturerna ovan gäller för. I 3D blir det 6,5° kallare per km över den.
base_heat_height: 0

precipitation:
  jan: 0
  feb: 0
  mar: 0
  apr: 0
  may: 0
  jun: 0
  jul: 0
  aug: 0
  sep: 0
  oct: 0
  nov: 0
  dec: 0

shift: 0

wind:
  jan: 1
  feb: 1
  mar: 1
  apr: 0
  may: 1
  jun: 1
  jul: 1
  aug: 1
  sep: 1
  oct: 2
  nov: 2
  dec: 1

# Förhärskande vind (västanvind, ca 36° N): varifrån vinden oftast blåser
# och hur stor del av dagarna (%). Övriga dagar: oftast en grannriktning, ibland vilken som helst.
prevailing_wind: SW
prevailing_chance: 45

events:
  - name: "Drake"
    occurs: 1
    days: 1000
