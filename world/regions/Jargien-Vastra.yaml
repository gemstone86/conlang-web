# Västra Jargien: samma klimat som det gamla Jargien.
# Mildare vintrar närmast gränsen mot ökenområdena (Tarkas, Ziu) med sitt termotropa inflöde.
name: "Jargien (Västra)"

temperature:
  jan: 7
  feb: 8
  mar: 8
  apr: 10
  may: 14
  jun: 16
  jul: 19
  aug: 21
  sep: 16
  oct: 14
  nov: 10
  dec: 8

temperature_drop: 2
drop_speed: 1

# Höjden (m ö.h.) som temperaturerna ovan gäller för. I 3D blir det 6,5° kallare per km över den.
base_heat_height: 400

precipitation:
  jan: 0
  feb: 0
  mar: 0
  apr: 0
  may: 0
  jun: 0
  jul: 0
  aug: 0
  sep: 1
  oct: 1
  nov: 1
  dec: 1

shift: 0

wind:
  jan: 1
  feb: 0
  mar: 0
  apr: 0
  may: 0
  jun: 0
  jul: 0
  aug: 0
  sep: 1
  oct: 1
  nov: 1
  dec: 2

# Förhärskande vind (västanvind, ca 41° N): varifrån vinden oftast blåser
# och hur stor del av dagarna (%). Övriga dagar: oftast en grannriktning, ibland vilken som helst.
prevailing_wind: SW
prevailing_chance: 45

events:
  - name: "Drake"
    occurs: 1
    days: 200
