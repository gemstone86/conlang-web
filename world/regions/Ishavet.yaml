# Ishavet: kallt antarktiskt hav, ganska blåsigt. Södra halvklotet: årstiderna är omvända (kallast i juli).
name: "Ishavet"

temperature:
  jan: -1
  feb: -2
  mar: -4
  apr: -7
  may: -10
  jun: -13
  jul: -14
  aug: -13
  sep: -11
  oct: -8
  nov: -5
  dec: -3

temperature_drop: 3
drop_speed: 1

# Höjden (m ö.h.) som temperaturerna ovan gäller för. I 3D blir det 6,5° kallare per km över den.
base_heat_height: 0

precipitation:
  jan: 1
  feb: 1
  mar: 1
  apr: 0
  may: 0
  jun: 0
  jul: 0
  aug: 0
  sep: 0
  oct: 0
  nov: 1
  dec: 1

shift: 0

wind:
  jan: 2
  feb: 2
  mar: 3
  apr: 3
  may: 3
  jun: 3
  jul: 3
  aug: 3
  sep: 3
  oct: 3
  nov: 2
  dec: 2

# Förhärskande vind (polar östanvind, ca 63° S): varifrån vinden oftast blåser
# och hur stor del av dagarna (%). Övriga dagar: oftast en grannriktning, ibland vilken som helst.
prevailing_wind: SE
prevailing_chance: 50

events:
  - name: "Snöstorm"
    occurs: 1
    days: 30
  - name: "Drivande isberg"
    occurs: 1
    days: 40
