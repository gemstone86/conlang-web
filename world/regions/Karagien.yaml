# Karagien: ökenklimat som Ziu och Tarkas, men svalare av luften från Kamor viken
# (70 % medel av Ziu och Tarkas, 30 % Kamor viken; nederbörd och vind på samma sätt).
name: "Karagien"

temperature:
  jan: 9
  feb: 12
  mar: 16
  apr: 21
  may: 26
  jun: 29
  jul: 32
  aug: 31
  sep: 27
  oct: 22
  nov: 15
  dec: 11

temperature_drop: 12
drop_speed: 5

# Höjden (m ö.h.) som temperaturerna ovan gäller för. I 3D blir det 6,5° kallare per km över den.
base_heat_height: 400

precipitation:
  jan: -1
  feb: -1
  mar: -1
  apr: -2
  may: -2
  jun: -2
  jul: -2
  aug: -2
  sep: -1
  oct: -1
  nov: 0
  dec: 0

shift: 0

wind:
  jan: 2
  feb: 1
  mar: 1
  apr: 1
  may: 1
  jun: 1
  jul: 1
  aug: 1
  sep: 1
  oct: 1
  nov: 1
  dec: 2

# Förhärskande vind (västanvind, ca 42° N): varifrån vinden oftast blåser
# och hur stor del av dagarna (%). Övriga dagar: oftast en grannriktning, ibland vilken som helst.
prevailing_wind: SW
prevailing_chance: 45

events:
  - name: "Drake"
    occurs: 1
    days: 1000
  - name: "Sandstorm"
    occurs: 1
    days: 80
  - name: "Värmebölja (+10C)"
    occurs: 1
    days: 250
  - name: "Svår åska"
    occurs: 1
    days: 400
