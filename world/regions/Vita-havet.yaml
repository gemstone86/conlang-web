# Vita havet: ett kallt innanhav, ungefär som Bajkalsjön. Södra halvklotet: årstiderna är omvända (kallast i juli).
name: "Vita havet"

temperature:
  jan: 6
  feb: 6
  mar: 1
  apr: -7
  may: -15
  jun: -21
  jul: -25
  aug: -24
  sep: -17
  oct: -9
  nov: -2
  dec: 4

temperature_drop: 5
drop_speed: 2

# Höjden (m ö.h.) som temperaturerna ovan gäller för. I 3D blir det 6,5° kallare per km över den.
base_heat_height: 0

precipitation:
  jan: 1
  feb: 1
  mar: 0
  apr: 0
  may: 0
  jun: 0
  jul: 0
  aug: -1
  sep: -1
  oct: 0
  nov: 0
  dec: 1

shift: 0

wind:
  jan: 0
  feb: 0
  mar: 1
  apr: 1
  may: 1
  jun: 1
  jul: 1
  aug: 1
  sep: 1
  oct: 1
  nov: 1
  dec: 0

# Förhärskande vind (polar östanvind, ca 75° S): varifrån vinden oftast blåser
# och hur stor del av dagarna (%). Övriga dagar: oftast en grannriktning, ibland vilken som helst.
prevailing_wind: SE
prevailing_chance: 50

events:
  - name: "Drake"
    occurs: 1
    days: 1000
  - name: "Isstorm"
    occurs: 1
    days: 60
