name: Browser smoke (temporary)
on: { push: { branches: [claude] } }
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -q -DskipTests package
      - run: |
          java -jar target/root-and-rune.jar > app.log 2>&1 &
          for i in $(seq 60); do curl -sf localhost:8080/api/auth/me && break; sleep 2; done
      - run: cd smoke && npm init -y >/dev/null && npm i playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null && node smoke.mjs
