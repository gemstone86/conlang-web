name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # compiles both apps, runs EvolverTest and CombinedAppTest (the whole app on a fresh database), builds the jar
      - run: mvn -B package
      # only when tests fail: their reports, kept briefly (the jar isn't kept: the deploy builds its own, and the
      # speech engine makes it large enough to fill GitHub's artifact storage)
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 3
