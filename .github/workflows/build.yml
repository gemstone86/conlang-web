name: Build and test

# Runs for pull requests only (pushes to main are tested by the deploy workflow, which builds with the tests).
# "Run workflow" on the Actions page (or gh workflow run) checks any branch by hand.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # compiles both apps, runs EvolverTest and CombinedAppTest (the whole app on a fresh database), builds the jar
      # the weather page's own tests (the travel rules, the painter's limits, the texts): plain Node, nothing to install
      - run: node --test src/test/js/*.test.js
      - run: mvn -B package
      # only when tests fail: their reports, kept briefly (the jar isn't kept: the deploy builds its own, and the
      # speech engine makes it large enough to fill GitHub's artifact storage)
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 3
