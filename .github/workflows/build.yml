name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # compiles both apps, runs EvolverTest and CombinedAppTest (the whole app on a fresh database), builds the jar
      - run: mvn -B package
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
      - uses: actions/upload-artifact@v4
        with:
          name: root-and-rune-jar
          path: target/root-and-rune.jar
          retention-days: 7
