name: Move test (temporary)
on: { push: { branches: [combined] } }
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: comb }
      - uses: actions/checkout@v4
        with: { path: old, ref: claude/v0.14.0-form-pruning }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: (cd old && mvn -B -q -DskipTests package) && (cd comb && mvn -B -q -DskipTests package)
      - run: |
          (cd old && java -jar target/root-and-rune.jar > ../old.log 2>&1 &)
          (cd comb && java -jar target/root-and-rune.jar > ../new.log 2>&1 &)
          for i in $(seq 90); do curl -sf localhost:8081/api/auth/me >/dev/null && curl -sf localhost:8080/api/auth/me >/dev/null && break; sleep 2; done
      - run: mkdir w && cd w && ../comb/e2e/move.sh
      - if: always()
        run: grep -hE 'ERROR|Exception' old.log new.log | head -30 || true
